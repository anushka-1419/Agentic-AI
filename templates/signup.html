
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | StayWise AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #f4f6f8;
            background:
                radial-gradient(
                    circle at top,
                    rgba(150, 220, 40, 0.12),
                    transparent 38rem
                ),
                #080b0d;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border: 1px solid #29313a;
            border-radius: 24px;
            background: #12161c;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
        }

        .logo {
            margin-bottom: 36px;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span,
        a {
            color: #baff35;
        }

        .badge {
            display: inline-block;
            margin-bottom: 18px;
            color: #baff35;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 34px;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #8f9aa9;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #c7ced8;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #303943;
            border-radius: 12px;
            outline: none;
            color: white;
            background: #0c1015;
            font-size: 15px;
        }

        input:focus {
            border-color: #baff35;
        }

        button {
            width: 100%;
            margin-top: 26px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            color: #0a0e08;
            background: #baff35;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
        }

        .message {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 14px;
            background: rgba(255, 80, 80, 0.10);
            border: 1px solid rgba(255, 100, 100, 0.3);
            color: #ffb1b1;
            font-size: 14px;
        }

        .footer {
            margin-top: 28px;
            color: #8f9aa9;
            text-align: center;
            font-size: 14px;
        }

        a {
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main class="auth-card">
        <div class="logo">
            StayWise <span>AI</span>
        </div>

        <div class="badge">✦ JOIN STAYWISE AI</div>

        <h1>Create account.</h1>

        <p class="subtitle">
            Sign up to start analyzing hotel experiences with AI.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('signup') }}">
            <label for="name">Full name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                autocomplete="name"
                required
            >

            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">
                Confirm password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Re-enter password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Create Account →
            </button>
        </form>

        <div class="footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </main>
</body>
</html>
